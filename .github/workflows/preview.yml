name: Android preview
on:
  push:
    branches: [master, fix/large-text-controls]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [23, 36]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Preserve preview signing identity between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: open-emergency-preview-debug-key-v1
      - name: Validate bundled content and build standalone handbook
        run: |
          python3 tools/build_handbook.py --check
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Generate printable bilingual handbooks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python3 -m pip install -r tools/requirements-pdf.txt
          python3 tools/build_pdf.py
      - name: Build and lint Android
        run: ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest :android:lintDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test app with Wi-Fi and mobile data disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          arch: x86_64
          api-level: ${{ matrix.api }}
          disable-animations: true
          script: bash tools/run_offline_checks.sh
      - name: Record APK identity and dependency inventory
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/build/outputs/apk/debug/*.apk > dist/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/build/outputs/apk/debug/*.apk > dist/APK-MANIFEST.txt
          ./gradlew :android:dependencies --configuration debugRuntimeClasspath --console=plain > dist/dependency-tree.txt
      - name: Package preview downloads
        run: |
          cp android/build/outputs/apk/debug/*.apk dist/OpenEmergencyHandbook-preview.apk
          git archive --format=tar.gz HEAD > dist/OpenEmergencyHandbook-source.tar.gz
          printf '%s\n' "$GITHUB_SHA" > dist/BUILD_COMMIT.txt
          cd dist
          sha256sum OpenEmergencyHandbook-preview.apk OpenEmergencyHandbook-en.pdf OpenEmergencyHandbook-de.pdf OpenEmergencyHandbook-offline.html OpenEmergencyHandbook-source.tar.gz Android-preview.png Usability-*.png coverage-report.json BUILD_COMMIT.txt APK-SIGNATURE.txt APK-MANIFEST.txt dependency-tree.txt > SHA256SUMS.txt
          rm emergency-window.xml
      - uses: actions/upload-artifact@v4
        with:
          name: OpenEmergencyHandbook-preview-api-${{ matrix.api }}
          path: dist/
          if-no-files-found: error
      - name: Upload test and lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-results-api-${{ matrix.api }}
          path: |
            android/build/reports/
            android/build/outputs/androidTest-results/
  publish-test-download:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenEmergencyHandbook-preview-api-36
          path: downloads
      - name: Publish free downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_TAG: preview-0.3.${{ github.run_number }}
          PREVIEW_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'NOTES'
          Android development preview for installation and usability testing.

          Download OpenEmergencyHandbook-preview.apk on an Android phone (Android 5.0+). Allow installation from the browser/file manager when Android asks, then open **Open Emergency Preview**. This APK is debug-signed for testing, not a Play Store production release. If a later build has a different signing identity, uninstalling the old preview may be necessary; that removes local notes.

          Included: 30 English and 30 German offline guides, all six disaster scenarios, first-aid/safe-water summaries, direct help actions, persistent Help/Search/Saved/Plan navigation, reader section jumps/bookmarks, adjustable text, optional screen-on mode, related guides and ranked bilingual search with labelled typo fallback, household checklist, water estimate, notes and explicit text export. No account, subscription, advertising or network permission.

          **All summaries and translations are unreviewed drafts. Coverage is incomplete. Test the app; do not treat this as a complete or professionally approved survival reference.** See About and coverage-report.json for gaps. Follow emergency services and current official instructions.

          Checks: content validation, 13 Python tests, Android compilation/lint, and 14 emulator tests on Android 6/API 23 and Android 16/API 36 with Wi-Fi/mobile data disabled. Scope: bundled EN/DE articles, visible urgent home actions, bilingual ranked/approximate search, Back-stack restoration, section jumps, bookmarks, reader/language recreation, 200% system text, dark palette, opt-in screen-on, household persistence/export and no INTERNET permission. These checks do not establish medical accuracy or real-world disaster readiness.

          Also included: standalone offline HTML handbook, printable English/German PDF handbooks, matching source archive, build commit, checksums, APK identity/signature, dependency tree and emulator screenshot. GPLv3 source and upstream attribution are preserved.

          Please test offline reading, search, language switching, large text and saved household data. Give feedback in pull request #1 without posting personal information.
          NOTES
          gh release create "$PREVIEW_TAG" downloads/* --target "$PREVIEW_COMMIT" --title "Open Emergency Handbook — Android preview $PREVIEW_TAG" --notes-file release-notes.md --prerelease
