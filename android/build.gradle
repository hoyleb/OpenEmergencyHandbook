apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    google()
}

android {
    compileSdk 36

    namespace "org.ligi.survivalmanual"

    defaultConfig {
        applicationId "com.hoyleb.openemergency"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 5
        versionName "0.3.1-preview"

        vectorDrawables.useSupportLibrary = true
        archivesBaseName = "OpenEmergencyHandbook-$versionName"

	testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".preview"
            versionNameSuffix "-debug"
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        // Only the new, attributed preview content ships. The inherited wiki
        // remains in Git history but is not silently bundled as reviewed advice.
        main.assets.srcDirs = ['src/main/offlineAssets']
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

// Android support
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'

// Third party
    implementation "com.chibatching.kotpref:kotpref:$kotpref_version"
    implementation "com.chibatching.kotpref:initializer:$kotpref_version"

    implementation 'org.jetbrains:markdown:0.7.3'
    implementation 'com.github.MikeOrtiz:TouchImageView:3.6'

// Testing
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:rules:1.6.1"
}
